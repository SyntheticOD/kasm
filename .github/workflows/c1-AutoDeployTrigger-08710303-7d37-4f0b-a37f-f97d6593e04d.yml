name: Trigger auto deployment for c1

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ 1.0 ]
    paths:
    - '**'
    - '.github/workflows/c1-AutoDeployTrigger-08710303-7d37-4f0b-a37f-f97d6593e04d.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.C1_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.C1_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.C1_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.C1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.C1_REGISTRY_PASSWORD }}
          containerAppName: c1
          resourceGroup: LokiCloud2_group
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


